<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Yükleniyor...</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1; --secondary: #a855f7; --bg: #0f172a; --text: #f1f5f9;
            --muted: #94a3b8; --card-bg: rgba(30, 41, 59, 0.7);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg);
            background-image: radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%), radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
            color: var(--text); line-height: 1.6; overflow-x: hidden; padding-bottom: 50px;
        }
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg);
            display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999;
        }
        .container { max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem; width: 100%; display: none; }
        .social-sidebar { position: fixed; right: 15px; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 10px; z-index: 1000; }
        .social-sidebar a { width: 46px; height: 46px; background: var(--card-bg); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; text-decoration: none; font-size: 1.2rem; transition: 0.3s; }
        .social-sidebar a:hover { transform: scale(1.1); background: var(--primary); }
        header { text-align: center; padding: 3rem 0; }
        .profile-img { width: 160px; height: 160px; border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; object-fit: cover; border: 4px solid var(--primary); animation: morph 8s ease-in-out infinite; }
        @keyframes morph { 0%, 100% { border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%; } 50% { border-radius: 50% 50% 33% 67% / 55% 27% 73% 45%; } }
        h1 { font-size: clamp(2rem, 8vw, 3.5rem); font-weight: 800; background: linear-gradient(to right, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 0.5rem; }
        .section-title { font-size: 1.5rem; font-weight: 700; margin: 2rem 0 1rem; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        .section-title::after { content: ""; height: 2px; flex: 1; background: linear-gradient(to right, var(--primary), transparent); }
        .card { background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.05); padding: 2rem; border-radius: 1.5rem; backdrop-filter: blur(12px); margin-bottom: 2rem; }
        .services-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.2rem; }
        .service-item { background: rgba(255,255,255,0.03); padding: 1.5rem; border-radius: 1.2rem; border: 1px solid rgba(255,255,255,0.05); }
        footer { text-align: center; padding: 3rem 0; border-top: 1px solid rgba(255,255,255,0.1); margin-top: 3rem; }
        .agt-link { color: var(--primary); text-decoration: none; font-weight: 800; transition: 0.3s; }
        .agt-link:hover { color: var(--secondary); }
        @media (max-width: 768px) { .container { padding: 1rem 0.75rem; } .social-sidebar { right: 5px; } }
    </style>
</head>
<body>
    <div id="loading-screen">
        <i class="fas fa-circle-notch fa-spin fa-3x" style="color: var(--primary); margin-bottom: 20px;"></i>
        <p>İçerik yükleniyor...</p>
    </div>

    <div class="social-sidebar" id="social-links"></div>

    <div class="container" id="main-content">
        <header>
            <div class="profile-container">
                <img id="v-img" src="" class="profile-img" alt="Profil">
            </div>
            <h1 id="v-name">...</h1>
            <p id="v-tagline" class="tagline">...</p>
        </header>

        <section id="hakkimda">
            <h2 class="section-title">Hakkımda</h2>
            <div class="card"><p id="v-about">...</p></div>
        </section>

        <section id="hizmetler">
            <h2 class="section-title">Hizmetler</h2>
            <div class="services-grid" id="v-services"></div>
        </section>

        <section id="iletisim">
            <h2 class="section-title">Bana Ulaşın</h2>
            <div class="card">
                <p id="v-address" style="margin-bottom: 10px;">📍 ...</p>
                <p id="v-email">📧 ...</p>
            </div>
        </section>

        <footer>
            <p id="v-copy">&copy; 2024. Tüm Hakları Saklıdır.</p>
            <div style="margin-top:10px">Powered By <a href="https://www.agtdijital.com" target="_blank" class="agt-link">Agt Dijital</a></div>
        </footer>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB3Bv4cNEkNtuUAp27YZL6h6XGU6zTRoc4",
            authDomain: "admin-8f08d.firebaseapp.com",
            databaseURL: "https://admin-8f08d-default-rtdb.firebaseio.com",
            projectId: "admin-8f08d",
            storageBucket: "admin-8f08d.firebasestorage.app",
            messagingSenderId: "122866337939",
            appId: "1:122866337939:web:21977ee6e11feb7b7aa566",
            measurementId: "G-NC7Z1PZE9L"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function init() {
            try {
                // 'content' dökümanını 'bio-data' koleksiyonundan çekiyoruz
                const docRef = doc(db, 'bio-data', 'main-content');
                const snap = await getDoc(docRef);

                if (snap.exists()) {
                    const data = snap.data();
                    document.getElementById('v-img').src = data.profileImg || 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=400&h=400&fit=crop';
                    document.getElementById('v-name').innerText = data.name;
                    document.getElementById('v-tagline').innerText = data.tagline;
                    document.getElementById('v-about').innerText = data.about;
                    document.getElementById('v-address').innerText = "📍 " + (data.address || "Belirtilmemiş");
                    document.getElementById('v-email').innerText = "📧 " + (data.email || "Belirtilmemiş");
                    document.getElementById('v-copy').innerText = `© ${new Date().getFullYear()} ${data.name}. Tüm Hakları Saklıdır.`;

                    // Hizmetler
                    const sGrid = document.getElementById('v-services');
                    sGrid.innerHTML = (data.services || []).map(s => `
                        <div class="service-item">
                            <i class="${s.icon} fa-2x" style="color: var(--primary); margin-bottom: 15px; display: block;"></i>
                            <h3>${s.title}</h3>
                            <p style="font-size: 0.9rem; color: var(--muted); margin-top:5px;">${s.desc}</p>
                        </div>
                    `).join('');

                    // Sosyal Linkler
                    const socialMap = {
                        whatsapp: 'fa-whatsapp', phone: 'fa-phone', facebook: 'fa-facebook-f',
                        instagram: 'fa-instagram', tiktok: 'fa-tiktok', x: 'fa-x-twitter'
                    };
                    const sidebar = document.getElementById('social-links');
                    sidebar.innerHTML = Object.entries(data.social || {}).map(([key, val]) => {
                        if(!val) return '';
                        return `<a href="${val}" target="_blank" title="${key}"><i class="fa-brands ${socialMap[key] || 'fa-link'}"></i></a>`;
                    }).join('');

                    document.getElementById('loading-screen').style.display = 'none';
                    document.getElementById('main-content').style.display = 'block';
                } else {
                    document.body.innerHTML = "<div style='text-align:center; padding:50px;'>Veritabanında veri bulunamadı. Lütfen önce Admin panelinden veri kaydedin.</div>";
                }
            } catch (e) {
                console.error(e);
                alert("Veritabanı bağlantı hatası!");
            }
        }
        window.onload = init;
    </script>
</body>
</html>
