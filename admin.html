<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gelişmiş Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #6366f1; --bg: #f1f5f9; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); padding: 20px; color: #0f172a; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 5px; color: #64748b; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px; font-family: inherit; }
        .btn { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; margin-top: 10px; }
        .service-box { background: #f8fafc; padding: 15px; border-radius: 10px; margin-bottom: 10px; border: 1px dashed #cbd5e1; position: relative; }
        .remove-service { position: absolute; right: 10px; top: 10px; color: #ef4444; cursor: pointer; }
        #admin-ui { display: none; }
    </style>
</head>
<body>
    <div class="container" id="login-ui">
        <h2 style="text-align:center">Admin Girişi</h2>
        <input type="email" id="email" placeholder="E-posta" style="margin-top:15px"><br>
        <input type="password" id="pass" placeholder="Şifre" style="margin-top:10px"><br>
        <button class="btn" onclick="login()">Giriş Yap</button>
    </div>

    <div class="container" id="admin-ui">
        <h2>İçerik Yönetimi</h2>
        <div class="form-group"><label>Profil Resim URL</label><input type="text" id="p-img"></div>
        <div class="form-group"><label>Ad Soyad</label><input type="text" id="p-name"></div>
        <div class="form-group"><label>Unvan</label><input type="text" id="p-tagline"></div>
        <div class="form-group"><label>Hakkımda</label><textarea id="p-about" rows="3"></textarea></div>
        <div class="form-group"><label>Adres</label><input type="text" id="p-addr"></div>
        <div class="form-group"><label>E-posta</label><input type="text" id="p-mail"></div>

        <h3>Hizmetler</h3>
        <div id="services-list"></div>
        <button class="btn" style="background:#10b981" onclick="addService()">+ Yeni Hizmet Ekle</button>

        <h3 style="margin-top:20px">Sosyal Medya (URL)</h3>
        <div class="form-group"><label>WhatsApp (Link)</label><input type="text" id="s-wa"></div>
        <div class="form-group"><label>Instagram</label><input type="text" id="s-ig"></div>
        <div class="form-group"><label>Facebook</label><input type="text" id="s-fb"></div>
        <div class="form-group"><label>TikTok</label><input type="text" id="s-tt"></div>
        <div class="form-group"><label>X</label><input type="text" id="s-x"></div>

        <button class="btn" onclick="saveData()">Tüm Verileri Kaydet</button>
        <button class="btn" style="background:#ef4444" onclick="logout()">Çıkış Yap</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyB3Bv4cNEkNtuUAp27YZL6h6XGU6zTRoc4", authDomain: "admin-8f08d.firebaseapp.com", projectId: "admin-8f08d", storageBucket: "admin-8f08d.firebasestorage.app", messagingSenderId: "122866337939", appId: "1:122866337939:web:21977ee6e11feb7b7aa566" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.login = () => {
            signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('pass').value).catch(e => alert("Hata!"));
        };

        window.logout = () => signOut(auth);

        onAuthStateChanged(auth, user => {
            document.getElementById('login-ui').style.display = user ? 'none' : 'block';
            document.getElementById('admin-ui').style.display = user ? 'block' : 'none';
            if(user) loadData();
        });

        window.addService = (title = '', desc = '', icon = 'fas fa-star') => {
            const div = document.createElement('div');
            div.className = 'service-box';
            div.innerHTML = `<i class="fas fa-trash remove-service" onclick="this.parentElement.remove()"></i>
                <label>İkon (FontAwesome)</label><input type="text" class="s-icon" value="${icon}">
                <label>Başlık</label><input type="text" class="s-title" value="${title}">
                <label>Açıklama</label><input type="text" class="s-desc" value="${desc}">`;
            document.getElementById('services-list').appendChild(div);
        };

        async function loadData() {
            const snap = await getDoc(doc(db, 'bio-data', 'main-content'));
            if(snap.exists()){
                const d = snap.data();
                document.getElementById('p-img').value = d.profileImg || '';
                document.getElementById('p-name').value = d.name || '';
                document.getElementById('p-tagline').value = d.tagline || '';
                document.getElementById('p-about').value = d.about || '';
                document.getElementById('p-addr').value = d.address || '';
                document.getElementById('p-mail').value = d.email || '';
                document.getElementById('s-wa').value = d.social?.whatsapp || '';
                document.getElementById('s-ig').value = d.social?.instagram || '';
                document.getElementById('s-fb').value = d.social?.facebook || '';
                document.getElementById('s-tt').value = d.social?.tiktok || '';
                document.getElementById('s-x').value = d.social?.x || '';
                document.getElementById('services-list').innerHTML = '';
                (d.services || []).forEach(s => window.addService(s.title, s.desc, s.icon));
            }
        }

        window.saveData = async () => {
            const services = Array.from(document.querySelectorAll('.service-box')).map(box => ({
                title: box.querySelector('.s-title').value,
                desc: box.querySelector('.s-desc').value,
                icon: box.querySelector('.s-icon').value
            }));
            const data = {
                profileImg: document.getElementById('p-img').value,
                name: document.getElementById('p-name').value,
                tagline: document.getElementById('p-tagline').value,
                about: document.getElementById('p-about').value,
                address: document.getElementById('p-addr').value,
                email: document.getElementById('p-mail').value,
                services: services,
                social: {
                    whatsapp: document.getElementById('s-wa').value,
                    instagram: document.getElementById('s-ig').value,
                    facebook: document.getElementById('s-fb').value,
                    tiktok: document.getElementById('s-tt').value,
                    x: document.getElementById('s-x').value
                }
            };
            await setDoc(doc(db, 'bio-data', 'main-content'), data);
            alert("Tüm veriler kaydedildi!");
        };
    </script>
</body>
</html>
